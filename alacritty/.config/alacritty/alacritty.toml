[general]
import = [
  "~/.config/alacritty/theme/mocha.toml",
]

[terminal.shell]
program = "tmux"
args = [
  "new-session",
  "-A",
  "-D",
  "-s",
  "main"
]

[window]
dimensions = { columns = 0, lines = 0 }
padding = { x = 10, y = 10 }
dynamic_padding = false
decorations = "Full"
opacity = 0.9
blur = false
startup_mode = "Maximized"
dynamic_title = true

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
size = 14
offset = { x = 0, y = 0 }
